name: Build & Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [build-from-content]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Optional but recommended to prevent deploy races
concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # --- PRE-CLEAN ---
      - name: Pre-clean workspace
        run: |
          rm -rf wwwroot content
          rm -rf __pycache__ .pytest_cache .mypy_cache

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Checkout content
        uses: actions/checkout@v4
        with:
          repository: violinmelody/rarity.content
          path: content
          token: ${{ secrets.RARITY_CONTENT_REPO_TOKEN }}
          fetch-depth: 0
          ref: main
          clean: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Needed for cairosvg (SVG -> PNG) on ubuntu runners
      - name: Install system dependencies (CairoSVG)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install markdown pillow cairosvg

      # Ensures no stale files in output directory even if we don't wipe it
      - name: Ensure clean output directory
        run: |
          rm -rf wwwroot
          mkdir -p wwwroot

      - name: Build site
        run: python build/build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wwwroot

      # --- POST CLEANUP ---
      - name: Post-clean workspace
        if: always()
        run: |
          rm -rf wwwroot content
          rm -rf __pycache__ .pytest_cache .mypy_cache

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
